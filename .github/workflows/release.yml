name: Release

# Push a `v<version>` tag that matches package.json to publish to npm.
# Publishing uses npm trusted publishing (OIDC), so no token is stored.
# Run it by hand for a dry run of the same checks.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11.17.0

      - run: pnpm install --frozen-lockfile

      - name: Tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: pnpm check

      # lib/ is committed, so the build must reproduce it exactly.
      - name: Committed lib/ is up to date
        run: git diff --exit-code -- lib

      - name: Publish
        if: github.ref_type == 'tag'
        run: npm publish

      - name: Publish (dry run)
        if: github.ref_type != 'tag'
        run: npm publish --dry-run
